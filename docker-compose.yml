# Postgres + wiki-server + Caddy (TLS). Boots with: docker compose up -d --build
# Needs a gitignored .env (copy from .env.example) with POSTGRES_PASSWORD, WIKI_DOMAIN,
# and the WIKI_SERVER_* settings. See DEPLOY.md.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wiki
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 3s
      retries: 5

  wiki-server:
    build:
      context: .
      dockerfile: wiki-server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      WIKI_MCP_DB: pg
      WIKI_MCP_PG_URL: postgresql://wiki:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/wiki
    ports:
      - "127.0.0.1:4437:4437"   # loopback only; public access via caddy
    volumes:
      - wikidata:/data
      - ./models:/models:ro     # built wiki-models bundles, rsynced by deploy.sh
    # READINESS, not liveness: the control listener binds LAST (after the read-model
    # projection, the model bundles and the auth gateway), so a 200 here means the stack
    # can actually serve. It listens on the container's loopback in auth mode, so the
    # probe has to run inside the container. During `start_period` a failing probe leaves
    # the container "starting" rather than "unhealthy" — a cold read model replays the
    # whole stream and that is slow, not broken.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch(`http://127.0.0.1:${WIKI_SERVER_CONTROL_PORT:-4438}/_server/health`).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 300s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - wiki-server
    environment:
      WIKI_DOMAIN: ${WIKI_DOMAIN:?Set WIKI_DOMAIN in .env (e.g. hotseat.thegoldenmule.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  wikidata:
  caddy_data:
  caddy_config:
